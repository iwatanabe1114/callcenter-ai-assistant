# ============================================================
# 実際のスプレッドシート「テスト」用の取得設定
#   ファイルID: 1rKl3y3zViOiavfoFsC_T2D4_MG9tukn5vfRx-DMXESw
#
# この中身を .streamlit/secrets.toml の末尾に貼り付けてください。
#
# 読み込まないシート（意図的に設定していません）:
#   メール配信リスト       … お客様のメールアドレス
#   カルテ項目            … 家族構成・お仕事などの個人情報テンプレート
#   IDPASS（クレカ）     … 現在は中身が空のため対象外
#
# ⚠️ サービスアカウントには「ファイル単位」で権限が付きます。
#    ここで設定しなかったシートもサービスアカウントからは読める状態になるので、
#    将来 IDPASS（クレカ）に実際の認証情報を入れる場合は、
#    そのときに別ファイルへ移してください。
# ============================================================


# ── マニュアル ────────────────────────────────────────────

# 回覧板：228件。社内の共有事項が一番たまっている場所
[[sources]]
genre = "manual"
name = "回覧板"
spreadsheet_id = "1rKl3y3zViOiavfoFsC_T2D4_MG9tukn5vfRx-DMXESw"
worksheet = "回覧板"
columns = ["No", "共有日", "カテゴリ", "対象", "タイトル", "実施日", "内容"]
title_columns = ["タイトル"]
body_columns = ["カテゴリ", "対象", "内容", "実施日", "共有日"]
# 共有日から半年（180日）を過ぎたものは取り込まない。
# 古い緊急連絡が「現在のルール」として回答されるのを防ぐため。
# ※日付が空・読み取れない行は除外しません（消しすぎないため）
date_column = "共有日"
max_age_days = 180

