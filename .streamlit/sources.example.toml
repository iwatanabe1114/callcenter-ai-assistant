# ── 料金 ──────────────────────────────────────────────────

# 全商材価格表：24件
# 1行目の列名に「金額(クレカ)」「配送方法」が3回ずつ出てくるので、
# 列名ではなく「列の位置」で指定し、column_labels で表示名を付けます。
# A列（商材名）はセル結合で空の行があるため、fill_down_columns で上の値を引き継ぎます。
[[sources]]
genre = "price"
name = "全商材価格表"
spreadsheet_id = "1rKl3y3zViOiavfoFsC_T2D4_MG9tukn5vfRx-DMXESw"
worksheet = "全商材価格表"
columns = ["A", "B", "E", "F", "G", "H", "I", "J", "K", "L", "M"]
title_columns = ["A", "B"]
body_columns = ["E", "F", "G", "H", "I", "J", "K", "L", "M"]
fill_down_columns = ["A"]

[sources.column_labels]
A = "商材"
B = "コース名"
E = "初回 金額(クレカ)"
F = "初回 金額(後払い)"
G = "初回 配送方法"
H = "2回目 金額(クレカ)"
I = "2回目 金額(後払い)"
J = "2回目 配送方法"
K = "3回目 金額(クレカ)"
L = "3回目 金額(後払い)"
M = "3回目 配送方法"


# ── 商品（8商材） ─────────────────────────────────────────
#
# 商材シートは「A列に項目名・その右の列に内容」という縦持ちです。
# 内容がB列の商材とC列の商材が混在しているため、value_columns を
# ["B","C","D"] にして、左から見て最初に値がある列を採用します。
# 1行が1件の資料になります（例：「爽軽青汁／全成分」）。

[[sources]]
genre = "product"
name = "爽軽青汁"
spreadsheet_id = "1rKl3y3zViOiavfoFsC_T2D4_MG9tukn5vfRx-DMXESw"
worksheet = "爽軽青汁"
layout = "key_value"
key_column = "A"
value_columns = ["B", "C", "D"]
skip_keys = ["商品画像", "実物画像", "同梱物"]
# 1行目はバナー（見出し・リンク）なので読み飛ばす
start_row = 2

